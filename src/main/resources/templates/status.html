<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Application Status</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Loan Approval System</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white text-center">
      <h2>Loan Application Status</h2>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li class="list-group-item"><strong>Applicant Name:</strong> <span th:text="${loanApplication.applicantName}"></span></li>
        <li class="list-group-item"><strong>Email:</strong> <span th:text="${loanApplication.email}"></span></li>
        <li class="list-group-item"><strong>Loan Amount:</strong> <span th:text="${loanApplication.loanAmount}"></span></li>
        <li class="list-group-item"><strong>Credit Score:</strong> <span th:text="${loanApplication.creditScore}"></span></li>
        <li class="list-group-item">
          <strong>Status:</strong>
          <span th:text="${loanApplication.status}"
                th:classappend="${loanApplication.status == 'Approved' ? 'text-success fw-bold' : (loanApplication.status == 'Rejected' ? 'text-danger fw-bold' : 'text-warning fw-bold')}">
                        </span>
        </li>
        <li class="list-group-item"><strong>Application ID:</strong> <span th:text="${loanApplication.id}"></span></li>
      </ul>
      <div class="text-center mt-3">
        <a href="/" class="btn btn-primary">Back to Home</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
