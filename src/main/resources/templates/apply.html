<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Loan Approval System</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h2>Loan Application Form</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/loan/submit}" th:object="${loanApplication}" method="post">
                <div class="mb-3">
                    <label for="applicantName" class="form-label">Applicant Name:</label>
                    <input type="text" th:field="*{applicantName}" id="applicantName" class="form-control" placeholder="Enter full name"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('applicantName')}" th:errors="*{applicantName}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="Enter email"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="loanAmount" class="form-label">Loan Amount:</label>
                    <input type="number" th:field="*{loanAmount}" id="loanAmount" class="form-control" placeholder="Enter loan amount"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('loanAmount')}" th:errors="*{loanAmount}"></div>
                </div>

                <div class="mb-3">
                    <label for="creditScore" class="form-label">Credit Score:</label>
                    <input type="number" th:field="*{creditScore}" id="creditScore" class="form-control" placeholder="Enter credit score"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('creditScore')}" th:errors="*{creditScore}"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success">Submit Application</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
